name: Deploy Recap

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts

      - name: Sync code to server
        run: |
          rsync -avz --delete \
            --exclude node_modules \
            --exclude .git \
            --exclude 'backend/.env' \
            --exclude uploads \
            ./ ubuntu@${{ secrets.LIGHTSAIL_HOST }}:~/recap/

      - name: Write env and deploy
        uses: appleboy/ssh-action@v1
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
          OAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLERK_SK: ${{ secrets.CLERK_SECRET_KEY }}
          PG_PASS: ${{ secrets.POSTGRES_PASSWORD }}
          CLERK_PK: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          RESEND_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DB_URL,OAI_KEY,CLERK_SK,PG_PASS,CLERK_PK,SMTP_URL,RESEND_KEY,EMAIL_FROM
          command_timeout: 15m
          script: |
            set -e

            # Write .env
            cat > ~/recap/backend/.env <<ENVEOF
            DATABASE_URL=${DB_URL}
            OPENAI_API_KEY=${OAI_KEY}
            CLERK_SECRET_KEY=${CLERK_SK}
            POSTGRES_PASSWORD=${PG_PASS}
            NODE_ENV=production
            PORT=3000
            APP_URL=https://personalrecap.com
            SMTP_URL=${SMTP_URL}
            RESEND_API_KEY=${RESEND_KEY}
            EMAIL_FROM=${EMAIL_FROM}
            ENVEOF
            sed -i 's/^[[:space:]]*//' ~/recap/backend/.env

            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com | sh
              sudo usermod -aG docker ubuntu
            fi

            # Install Node.js if not present
            if ! command -v node &> /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            # Install nginx if not present
            if ! command -v nginx &> /dev/null; then
              sudo apt-get update && sudo apt-get install -y nginx
              sudo systemctl enable nginx
            fi

            # Build frontend
            cd ~/recap/web
            npm ci
            VITE_CLERK_PUBLISHABLE_KEY=${CLERK_PK} VITE_API_URL=https://api.personalrecap.com npx vite build
            sudo rm -rf /var/www/personalrecap
            sudo mkdir -p /var/www/personalrecap
            sudo cp -r dist/* /var/www/personalrecap/

            # Build and restart backend containers
            cd ~/recap/backend
            docker compose -f docker-compose.yml down || true
            docker compose -f docker-compose.yml up -d --build --remove-orphans

            # Run database migrations
            sleep 10
            for migration in ~/recap/backend/drizzle/0*.sql; do
              [ -f "$migration" ] || continue
              docker compose -f docker-compose.yml exec -T db psql -U recap -d recap -f /dev/stdin < "$migration" 2>/dev/null || true
            done

            # Ensure enum values are up to date
            docker compose -f docker-compose.yml exec -T db psql -U recap -d recap -c "ALTER TYPE insight_type ADD VALUE IF NOT EXISTS 'activity_summary';" 2>/dev/null || true

            # Configure nginx
            sudo tee /etc/nginx/sites-available/personalrecap > /dev/null <<'NGINX'
            server {
                listen 80;
                server_name personalrecap.com www.personalrecap.com;
                root /var/www/personalrecap;
                index index.html;
                location / {
                    try_files $uri $uri/ /index.html;
                }
            }
            server {
                listen 80;
                server_name api.personalrecap.com;
                location / {
                    proxy_pass http://127.0.0.1:3001;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    client_max_body_size 250M;
                    client_body_timeout 300s;
                    proxy_read_timeout 300s;
                    proxy_send_timeout 300s;
                }
            }
            NGINX
            sudo sed -i 's/^            //' /etc/nginx/sites-available/personalrecap

            sudo ln -sf /etc/nginx/sites-available/personalrecap /etc/nginx/sites-enabled/
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo nginx -t && sudo systemctl restart nginx

            # Wait for health check
            echo "Waiting for API to start..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3001/health > /dev/null 2>&1; then
                echo "API is healthy!"
                exit 0
              fi
              sleep 3
            done
            echo "Health check failed — showing logs:"
            docker compose -f docker-compose.yml logs --tail=50 api
            exit 1
